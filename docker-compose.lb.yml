services:
  load-balancer:
    image: nginx:alpine
    container_name: load-balancer
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - app-network
    restart: unless-stopped

  web:
    image: counter-app:1.0
    networks:
      - app-network
    expose:
      - "5000"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      - db-service
    restart: unless-stopped

  db-service:
    image: redis:alpine
    container_name: db-service
    networks:
      - app-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
